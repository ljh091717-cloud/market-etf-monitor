name: Hourly US ETF indicators

on:
  schedule:
    # Cheap daily reference refresh before the market; never calls AI.
    - cron: '10 9 * * 1-5'
      timezone: 'America/New_York'
    # Prepare data before 10:30..15:30 reviews and the close+30m review.
    # The Python calendar gates holidays, early closes and delayed runs.
    - cron: '20 10-16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      manual_test:
        description: 'Write separate test.json only; never use test data for trading'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: pages-market-indicators
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      publish: ${{ steps.collect_data.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: market_monitor_starter/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r market_monitor_starter/requirements.txt
      - name: Test calculations and scheduling gates
        working-directory: market_monitor_starter
        run: python -m unittest discover -s tests -v
      - name: Collect and validate latest market data
        id: collect_data
        working-directory: market_monitor_starter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.manual_test }}" = "true" ]; then
            python monitor_runner.py --test
          else
            python monitor_runner.py
          fi
      - name: Save references and verified snapshots for ChatGPT
        if: steps.collect_data.outputs.save == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in reference_us.json latest.json previous.json state_us.json; do
            path="market_monitor_starter/docs/data/$file"
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No new public market state to commit.'
            exit 0
          fi
          git commit -m 'data: update US reference and observation state [skip ci]'
          git push origin HEAD:main
      - name: Configure Pages
        if: steps.collect_data.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        if: steps.collect_data.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: market_monitor_starter/docs

  deploy:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
