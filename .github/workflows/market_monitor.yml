name: Hourly US ETF indicators

on:
  schedule:
    # US regular-market weekdays. The collector additionally checks actual holidays and early closes.
    - cron: '40 9-15 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      manual_test:
        description: 'Publish a TEST snapshot for setup verification (never use for trading)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: pages-market-indicators
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.collect_data.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: market_monitor_starter/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r market_monitor_starter/requirements.txt
      - name: Collect and validate latest market data
        id: collect_data
        working-directory: market_monitor_starter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.manual_test }}" = "true" ]; then
            python collector.py --test
          else
            python collector.py
          fi
      - name: Save verified live snapshot to repository for ChatGPT
        if: steps.collect_data.outputs.publish == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_monitor_starter/docs/data/latest.json
          if git diff --cached --quiet; then
            echo 'No new market data to commit.'
            exit 0
          fi
          git commit -m 'data: update verified US ETF snapshot [skip ci]'
          git push origin HEAD:main
      - name: Configure Pages
        if: steps.collect_data.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        if: steps.collect_data.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: market_monitor_starter/docs

  deploy:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
